name: Release

# Releases are cut by pushing a tag shaped `<workspace-directory>@<version>`,
# for example `todo@0.1.1`. The tag names which package to release.
#
# The tag stages the version, it does not publish it. `npm stage publish` puts
# the version in npm's staging queue and a maintainer approves it with 2FA -
# `npm stage approve <stage-id>`, or the Staged Packages tab on npmjs.com.
#
# Two reasons this is the release path and not `npm publish`:
#
#   - A brand-new package needs no hand publish and no throwaway version. When
#     a staged publish creates a name that does not exist yet, npm itself writes
#     a `0.0.0-stage` placeholder, and the real version waits in the queue.
#   - A trusted publisher is configured per package, from the package's own
#     settings page, so it cannot exist before the package does. Staging keeps
#     the first release out of that chicken-and-egg: the workflow creates the
#     package, and the trusted publisher stops being on the critical path.
#
# The credential is a granular npm token that may only stage packages, held as
# the NPM_STAGE_TOKEN secret. It cannot publish on its own: a staged version
# still needs a human with 2FA to approve it. That is also the path npm keeps
# open - tokens that bypass 2FA lose direct publish, not the ability to stage.
#
# The npm CLI prefers an OIDC identity when the environment offers one, so a
# package whose trusted publisher already allows staging stages through OIDC and
# never touches the token; a package that does not exist yet has no trusted
# publisher to match, and the token is what creates it. Both cases land in the
# same queue.
on:
  push:
    tags:
      - "*@*"

permissions:
  contents: write # only used at the end, to open the release page for the tag
  id-token: write # lets the build ask for a provenance attestation

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: npm ci
      - run: npm test
      - run: npm run typecheck

      - name: Resolve the tagged package
        id: target
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          DIRECTORY="${TAG%@*}"
          VERSION="${TAG##*@}"
          MANIFEST="packages/${DIRECTORY}/package.json"

          if [ ! -f "$MANIFEST" ]; then
            echo "::error::No package manifest at ${MANIFEST} for tag ${TAG}"
            exit 1
          fi

          NAME=$(node -p "require('./${MANIFEST}').name")
          ACTUAL=$(node -p "require('./${MANIFEST}').version")

          if [ "$ACTUAL" != "$VERSION" ]; then
            echo "::error::Tag says ${VERSION} but ${MANIFEST} says ${ACTUAL}. Bump the version before tagging."
            exit 1
          fi

          echo "Staging ${NAME}@${VERSION}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Stage the version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_STAGE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::No NPM_STAGE_TOKEN secret. Create a granular npm token for the @danielbdev scope that may only stage packages, and add it as a repository secret."
            exit 1
          fi

          npm stage publish -w "${{ steps.target.outputs.name }}" --access public --provenance

          {
            echo "### Staged ${{ steps.target.outputs.name }}@${{ steps.target.outputs.version }}"
            echo
            echo "Nothing is installable until a maintainer approves it with 2FA:"
            echo
            echo '```sh'
            echo "npm stage list"
            echo "npm stage approve <stage-id>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A tag with no release page is a version nobody can ask about. The notes
      # are generated from the commits since the previous release; edit them
      # afterwards when the list is broader than the package being released.
      # The prepended line is there because this page can exist while the npm
      # version is still waiting for approval.
      - name: Open the release page for the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="${{ steps.target.outputs.name }} ${{ steps.target.outputs.version }}"
          gh release create "$GITHUB_REF_NAME" \
            --title "$TITLE" \
            --generate-notes \
            --notes "Staged, not yet installable. A maintainer approves ${{ steps.target.outputs.name }}@${{ steps.target.outputs.version }} with 2FA: run npm stage list, then npm stage approve <stage-id>."
